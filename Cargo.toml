[workspace]
members = [
    "text_buffer",
    "phisical_layouter",
    "stroke_parser",
    "markdown_heading_splitter",
    "tagbase_memo",
    "font_collector",
    "font_rasterizer",
    "rokid_3dof",
    "ui_support",
    "font_rasterizer_example",
    "sample_codes/*",
    "kashikishi",
    "ttf_overlap_remover",
    "highlighter",
]
resolver = "2"

[workspace.dependencies]
git2 = { version = "0.20.4", default-features = false }
thiserror = "2.0.21"
wgpu = "30.0.1"
# fork元は winit = "0.31.x" ブランチ。いくつかのパッチを当てたものを使っている。
# patch-1
#   wasm で ime support が十分でないのでパッチを当てている。
#   EditContext API を利用している都合上、 2025/11/30 現在、Chromium ベースのブラウザでしか動作しない。
#   以下の issue で対応を進めているが upstream に取り込まれたら fork をやめる。
#   
#   https://github.com/rust-windowing/winit/issues/4424
winit = { git = "https://github.com/mitoma/winit", branch = "v0.31.x-fork-for-kashikishi" }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.154"
toml = "1.2.1"
env_logger = "0.11.11"
log = "0.4.35"
pollster = "1.0.1"
image = "0.25.10"
harfrust = "0.16.0"
skrifa = "0.50.0"
read-fonts = { version = "0.47.0" }
web-time = { version = "1.1.0" }
glam = "0.34.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
bitflags = "2.13.2"
rand = "0.10.3"
cfg-if = "1.0.5"
arboard = "3.7.0"
dirs = "7.0.0"
futures = "0.3.34"

# 複数のクレートで使用される依存関係
unicode-width = "0.2.3"
cached = "4.1.1"
usvg = { version = "0.50.0", default-features = false }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
js-sys = "0.3.107"
getrandom = "0.4.3"
hidapi = "2.6.7"
vqf-rs = "0.3.0"
tiny-skia-path = "0.12.0"
tiny-skia = "0.12.0"
indoc = "2.0.8"
similar = "3.2.1"
serde-jsonlines = "0.7.0"
chrono = "0.4.45"
clap = "4.6.7"
arborium = { git = "https://github.com/mitoma/arborium", branch = "support_markdown_inline_dist", default-features = false, features = [
    "lang-markdown",
    "lang-markdown-inline",
    "lang-rust",
    "lang-java",
    "lang-go",
    "lang-json",
    "lang-bash",
    "lang-toml",
] }
html-to-markdown-rs = "3.22.0"

redb = "4.6.0"
rayon = "1.12.0"
apng = { git = "https://github.com/mitoma/apng", branch = "master" }
winresource = "0.1.34"

# windows crate の依存。windows_hello の実験用コードにしか使われていない。
windows-bindgen = "0.100.0"
windows-core = "0.100.0"
windows-future = "0.100.0"
windows-link = "0.100.0"
windows-time = "0.100.0"

regex = "1.12.4"
png = "0.18.1"
icu_segmenter = "2.4.0"

serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
inquire = "0.9.4"

[profile.release-optimized]
inherits = "release"
debug = false
lto = true

# Dev 環境でのテスト時の動作が遅いので導入してみたが、ビルドが遅くなる事のつらみの方が大きい
#[profile.dev]
#opt-level = 1
#
#[profile.dev.package."*"]
#opt-level = 2
